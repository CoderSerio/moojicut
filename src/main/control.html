<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
    <title>Mooncap recording</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 15px; color: #f7f4ed; background: #242923; font: 14px system-ui; display: flex; align-items: center; gap: 12px; -webkit-app-region: drag; }
      .dot { width: 9px; height: 9px; background: #ff7065; border-radius: 50%; }
      .label { flex: 1; } small { display: block; margin-top: 3px; opacity: .7; font-size: 10px; }
      button { border: 0; border-radius: 6px; background: #f7f4ed; color: #242923; padding: 9px 13px; font: inherit; cursor: pointer; -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <span class="dot" aria-hidden="true"></span>
    <div class="label">Recording <span id="elapsed">0:00</span><small>Ctrl / ⌘ + Shift + X to stop</small></div>
    <button id="stop" type="button">Stop</button>
    <script src="./control.js"></script>
  </body>
</html>
