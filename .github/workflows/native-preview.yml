name: Native desktop previews

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Preview release version
        required: true
        default: 0.1.0-alpha.16
  push:
    branches: [main]
    paths:
      - src/**
      - native/**
      - bindings/**
      - build/**
      - platform/**
      - plugins/**
      - components/**
      - scripts/desktop.py
      - scripts/native_modules.py
      - scripts/check_native_boundaries.py
      - scripts/check_module_boundaries.py
      - test/build/**
      - test/native/**
      - scripts/install_moon.py
      - scripts/install_gstreamer.py
      - scripts/gstreamer_runtime.py
      - scripts/media_tests.py
      - scripts/install_linux_gstreamer.py
      - scripts/linux_media_runtime.py
      - scripts/generate_icons.py
      - assets/icons/**
      - assets/brand/mooji-cut/**
      - .gitattributes
      - moon.mod
      - .github/workflows/native-preview.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      PREVIEW_VERSION: ${{ inputs.version || '0.1.0-alpha.16' }}
      MOOJICUT_SMOKE_SCREENSHOT: ${{ github.workspace }}/.artifacts/${{ matrix.platform }}/smoke.${{ matrix.platform == 'windows' && 'bmp' || 'png' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools not found' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config gdb bison flex nasm patchelf libgtk-3-dev libayatana-appindicator3-dev libcurl4-openssl-dev xvfb dbus-x11 fonts-noto-cjk libxtst-dev libportal-dev libportal-gtk3-dev libvpx-dev libflac-dev libsoundtouch-dev libopenh264-dev libpulse-dev libx11-dev libxext-dev libxfixes-dev libxdamage-dev libpipewire-0.3-dev libspa-0.2-dev
      - name: Set up pinned Linux media build tools
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'media-build-tools'
          lock = json.loads(pathlib.Path('build/linux-media-sdk.json').read_text())
          subprocess.run([sys.executable, '-m', 'venv', root], check=True)
          subprocess.run([root / 'bin/python', '-m', 'pip', 'install', '--disable-pip-version-check',
                          *[name + '==' + version for name, version in lock['tools'].items()]], check=True)
          with open(os.environ['GITHUB_PATH'], 'a') as out:
              out.write(str(root / 'bin') + '\n')
          PY
      - name: Restore private Linux media SDK
        if: runner.os == 'Linux'
        id: linux_media_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/linux-media-sdk
          key: linux-media-ubuntu22-x64-${{ hashFiles('build/linux-media-sdk.json', 'scripts/install_linux_gstreamer.py') }}
      - name: Restore locked Linux media sources
        if: runner.os == 'Linux'
        id: linux_sources_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/linux-media-sources
          key: linux-media-sources-${{ hashFiles('build/linux-media-sdk.json') }}
      - name: Build and validate private Linux media SDK
        if: runner.os == 'Linux'
        run: |
          python scripts/install_linux_gstreamer.py --prefix "$RUNNER_TEMP/linux-media-sdk" --cache "$RUNNER_TEMP/linux-media-sources" --jobs 4
          echo "MOOJICUT_LINUX_MEDIA_SDK=$RUNNER_TEMP/linux-media-sdk" >> "$GITHUB_ENV"
      - name: Save validated Linux media SDK
        if: runner.os == 'Linux' && steps.linux_media_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/linux-media-sdk
          key: ${{ steps.linux_media_cache.outputs.cache-primary-key }}
      - name: Save locked Linux media sources
        if: runner.os == 'Linux' && steps.linux_sources_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/linux-media-sources
          key: ${{ steps.linux_sources_cache.outputs.cache-primary-key }}
      - name: Install pinned MoonBit compiler and core
        id: moon_install
        run: python scripts/install_moon.py "${{ runner.temp }}/moonbit"
      - name: Cache verified Windows media SDK archive
        if: runner.os == 'Windows'
        id: media_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gstreamer-archives
          key: gstreamer-msvc-x64-${{ hashFiles('build/gstreamer-sdk.json') }}
      - name: Install and validate private Windows media SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/install_gstreamer.py "${{ runner.temp }}/gstreamer-sdk" --cache "${{ runner.temp }}/gstreamer-archives"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "MOOJICUT_GSTREAMER_SDK=${{ runner.temp }}/gstreamer-sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Save verified SDK archive
        if: runner.os == 'Windows' && steps.media_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gstreamer-archives
          key: ${{ steps.media_cache.outputs.cache-primary-key }}
      - name: Build, test and package Windows
        if: runner.os == 'Windows'
        run: python scripts/desktop.py release --release-version "$env:PREVIEW_VERSION"
      - name: Build, test and package Linux
        if: runner.os == 'Linux'
        env:
          MOOJICUT_X11_INPUT_SMOKE: '1'
          MOOJICUT_MEDIA_DEBUGGER: '1'
        run: xvfb-run -a dbus-run-session -- python scripts/desktop.py release --release-version "$PREVIEW_VERSION"
      - name: Check generated interfaces match the checkout
        if: ${{ always() && steps.moon_install.outcome == 'success' }}
        shell: bash
        run: |
          moon info --target native
          git ls-files --eol -- ':(glob)src/**/pkg.generated.mbti'
          git diff --exit-code -- ':(glob)src/**/pkg.generated.mbti'
          test -z "$(git ls-files --others --exclude-standard -- ':(glob)src/**/pkg.generated.mbti')"
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.platform }}-x64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload media diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.platform }}-x64
          path: |
            .artifacts/${{ matrix.platform }}/media-tests/**/results.json
            .artifacts/${{ matrix.platform }}/media-tests/**/*.log
            .artifacts/${{ matrix.platform }}/media-tests/**/runtime/manifest.json
            .artifacts/${{ matrix.platform }}/media-tests/**/media/*.mkv
            .artifacts/${{ matrix.platform }}/media-tests/**/media/*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: |
            .artifacts/${{ matrix.platform }}/smoke.*
            .artifacts/${{ matrix.platform }}/shared-canvas/*.bmp
            .artifacts/${{ matrix.platform }}/shared-canvas/*.png
            .artifacts/${{ matrix.platform }}/video-editor-*/*.png
            .artifacts/${{ matrix.platform }}/video-editor-*/*.bmp
          if-no-files-found: ignore
          retention-days: 14
