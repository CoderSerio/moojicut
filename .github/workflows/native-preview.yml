name: Native desktop previews

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Preview release version
        required: true
        default: 0.1.0-alpha.16
  push:
    branches: [main]
    paths:
      - src/**
      - native/windows/**
      - native/linux/**
      - native/shared/**
      - platform/**
      - plugins/**
      - components/**
      - scripts/desktop.py
      - scripts/native_modules.py
      - scripts/check_module_boundaries.py
      - test/build/**
      - test/native/**
      - scripts/install_moon.py
      - scripts/generate_icons.py
      - assets/icons/**
      - assets/brand/mooji-cut/**
      - .gitattributes
      - moon.mod
      - .github/workflows/native-preview.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} x64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: linux
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PREVIEW_VERSION: ${{ inputs.version || '0.1.0-alpha.16' }}
      MOOJICUT_SMOKE_SCREENSHOT: ${{ github.workspace }}/.artifacts/${{ matrix.platform }}/smoke.${{ matrix.platform == 'windows' && 'bmp' || 'png' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up MSVC x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'MSVC x64 tools not found' }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # LLVM's slotted development package conflicts with GStreamer's
          # libunwind-dev dependency on the Ubuntu 22.04 runner. Keep runtimes.
          dpkg-query -W 'libunwind*' 'libc++*' || true
          mapfile -t llvm_unwind_devel < <(dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package}\n' 'libunwind-*-dev' 2>/dev/null | awk '$1 == "ii" && $2 ~ /^libunwind-[0-9]+-dev(:[^ ]+)?$/ {print $2}')
          if ((${#llvm_unwind_devel[@]})); then
            sudo apt-get remove -y "${llvm_unwind_devel[@]}"
          fi
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libayatana-appindicator3-dev libcurl4-openssl-dev xvfb dbus-x11 fonts-noto-cjk libxtst6 libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libportal-dev libportal-gtk3-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire
      - name: Install pinned MoonBit compiler and core
        id: moon_install
        run: python scripts/install_moon.py "${{ runner.temp }}/moonbit"
      - name: Build, test and package Windows
        if: runner.os == 'Windows'
        run: python scripts/desktop.py release --release-version "$env:PREVIEW_VERSION"
      - name: Build, test and package Linux
        if: runner.os == 'Linux'
        env:
          MOOJICUT_X11_INPUT_SMOKE: '1'
        run: xvfb-run -a dbus-run-session -- python scripts/desktop.py release --release-version "$PREVIEW_VERSION"
      - name: Check generated interfaces match the checkout
        if: ${{ always() && steps.moon_install.outcome == 'success' }}
        shell: bash
        run: |
          moon info --target native
          git ls-files --eol -- ':(glob)src/**/pkg.generated.mbti'
          git diff --exit-code -- ':(glob)src/**/pkg.generated.mbti'
          test -z "$(git ls-files --others --exclude-standard -- ':(glob)src/**/pkg.generated.mbti')"
      - name: Upload tested packages
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.platform }}-x64
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}
          path: .artifacts/${{ matrix.platform }}/smoke.*
          if-no-files-found: ignore
          retention-days: 14
